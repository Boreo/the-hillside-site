name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  # Client-request issues arrive via the email intake worker. Post a plan
  # comment only; work starts when the owner replies with an @claude go-ahead.
  triage:
    if: |
      github.event_name == 'issues' && github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'client-request') &&
      !contains(github.event.issue.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # hillside-voice depends on the humanizer pattern list
      - name: Fetch humanizer skill
        run: |
          git clone -q https://github.com/blader/humanizer.git .claude/skills/humanizer
          git -C .claude/skills/humanizer checkout -q 225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8

      - name: Triage client request
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
              }
            }
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(gh issue comment:*),Bash(gh issue view:*)"
          prompt: |
            Issue #${{ github.event.issue.number }} in ${{ github.repository }} is a
            client request received by email. Read the issue and the repository's
            CLAUDE.md, then post ONE comment on the issue containing:
            - a one-paragraph reading of what the client wants
            - the files you would change and roughly how
            - when the request changes guest-facing copy: ~3 candidate wordings
              in the hillside-voice style (read .claude/skills/hillside-voice/SKILL.md
              first), plus which one you recommend and why in a sentence
            - any ambiguities that need the owner's call
            - a final line: "Reply `@claude go` (plus any corrections) to proceed."
            Do not change any files and do not start the work.

  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && !contains(github.event.issue.labels.*.name, 'client-request') && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # hillside-voice depends on the humanizer pattern list
      - name: Fetch humanizer skill
        run: |
          git clone -q https://github.com/blader/humanizer.git .claude/skills/humanizer
          git -C .claude/skills/humanizer checkout -q 225a6f39ac85f76ee48dbad772ea4abe4ed6c9d8

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Branch protection is unavailable on this private repo's plan. The hook
      # catches mistaken pushes to main or dev; `git push --no-verify` skips it.
      - name: Block pushes to main and dev
        run: |
          cat > .git/hooks/pre-push <<'EOF'
          #!/bin/sh
          while read -r _ _ remote_ref _; do
            case "$remote_ref" in
              refs/heads/main|refs/heads/dev)
                echo "Push to ${remote_ref#refs/heads/} blocked. Push a branch and open a PR to dev." >&2
                exit 1 ;;
            esac
          done
          EOF
          chmod +x .git/hooks/pre-push

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1.0.236
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Branches are cut from dev; the compare link Claude posts targets dev.
          base_branch: dev

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          settings: |
            {
              "env": {
                "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
              }
            }

          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Bash(npm install),Bash(npm ci),Bash(npm run build),Bash(npm test),Bash(npx astro check),Bash(gh pr create:*)"

