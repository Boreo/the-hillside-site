name: Notify client on request completion

on:
  issues:
    types: [closed]

jobs:
  notify:
    if: contains(github.event.issue.labels.*.name, 'client-request') && github.event.issue.state_reason == 'completed'
    runs-on: ubuntu-latest
    permissions:
      issues: read
    steps:
      - name: Ping intake worker
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_URL: https://hillside-mail-intake.github-e53.workers.dev/notify
          NOTIFY_TOKEN: ${{ secrets.INTAKE_NOTIFY_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          CLOSED_AT: ${{ github.event.issue.closed_at }}
        run: |
          # Closing note: newest maintainer comment starting "Note to client:"
          # within 10 minutes of the close, relayed without the marker. Client
          # replies posted by the intake worker also count as OWNER, so the
          # marker is what separates a note from everything else.
          COMMENT=$(gh api "repos/$REPO/issues/$ISSUE/comments?per_page=100" --jq '
            [ .[]
              | select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")
              | select((env.CLOSED_AT | fromdateiso8601) - (.created_at | fromdateiso8601) | fabs < 600)
              | select(.body | test("^\\s*note to client:"; "i"))
            ] | last | .body // "" | sub("^\\s*note to client:\\s*"; ""; "i")')
          jq -n --argjson issue "$ISSUE" --arg title "$TITLE" --arg comment "$COMMENT" \
            '{issue: $issue, title: $title, comment: $comment}' |
            curl -sf -X POST -H 'content-type: application/json' \
              -H "authorization: Bearer $NOTIFY_TOKEN" -d @- "$NOTIFY_URL"
